<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAE Population Density Map</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        #map { width: 100vw; height: 100vh; }

        /* Title overlay */
        .map-title {
            position: absolute;
            top: 16px;
            left: 56px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            color: #f8fafc;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        .map-title span {
            color: #38bdf8;
        }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 40px;
            right: 16px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            color: #f8fafc;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .legend h4 {
            margin-bottom: 6px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #94a3b8;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
            font-size: 11px;
        }
        .legend-color {
            width: 18px;
            height: 10px;
            border-radius: 2px;
            margin-right: 7px;
            flex-shrink: 0;
        }

        /* Stats panel */
        .stats-panel {
            position: absolute;
            bottom: 40px;
            left: 16px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            color: #f8fafc;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            min-width: 180px;
        }
        .stats-panel h4 {
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #94a3b8;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .stat-row .label { color: #94a3b8; }
        .stat-row .value { font-weight: 600; color: #f8fafc; }

        /* Tooltip */
        .mapboxgl-popup-content {
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(12px);
            color: #f8fafc !important;
            border-radius: 10px !important;
            padding: 14px 18px !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .mapboxgl-popup-tip {
            border-top-color: rgba(15, 23, 42, 0.95) !important;
        }
        .mapboxgl-popup-close-button {
            color: #94a3b8 !important;
            font-size: 18px !important;
            padding: 4px 8px !important;
        }
        .popup-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .popup-stat {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .popup-stat .label { color: #94a3b8; }
        .popup-stat .value { font-weight: 600; }
        .popup-stat .value.high { color: #f87171; }
        .popup-stat .value.med { color: #fbbf24; }
        .popup-stat .value.low { color: #34d399; }

        /* Right-side controls panel */
        .right-panel {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* View toggle */
        .view-toggle {
            display: flex;
            gap: 0;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .view-toggle button {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            flex: 1;
        }
        .view-toggle button:hover { color: #e2e8f0; background: rgba(255,255,255,0.05); }
        .view-toggle button.active {
            color: #f8fafc;
            background: rgba(56, 189, 248, 0.2);
        }

        /* 3D height slider */
        .height-control {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            padding: 12px 16px;
            display: none;
        }
        .height-control label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #64748b;
            display: block;
            margin-bottom: 6px;
        }
        .height-control input[type="range"] {
            width: 100%;
            accent-color: #38bdf8;
        }

        /* Custom building search */
        .building-search {
            position: absolute;
            top: 60px;
            left: 56px;
            z-index: 20;
            width: 280px;
        }
        .building-search input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #f8fafc;
            font-size: 14px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            outline: none;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .building-search input::placeholder { color: #64748b; }
        .building-search input:focus { border-color: rgba(56,189,248,0.4); }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 12px;
            width: 16px;
            height: 16px;
            color: #64748b;
            pointer-events: none;
        }
        .search-results {
            margin-top: 4px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            max-height: 280px;
            overflow-y: auto;
            display: none;
        }
        .search-results.visible { display: block; }
        .search-result-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.15s;
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover { background: rgba(56, 189, 248, 0.12); }
        .search-result-item .sr-name {
            color: #f8fafc;
            font-size: 13px;
            font-weight: 500;
        }
        .search-result-item .sr-community {
            color: #64748b;
            font-size: 11px;
            margin-top: 2px;
        }
        .search-result-item .sr-name mark {
            background: rgba(56, 189, 248, 0.3);
            color: #f8fafc;
            border-radius: 2px;
            padding: 0 1px;
        }
        .search-loading {
            padding: 12px 14px;
            color: #64748b;
            font-size: 13px;
            text-align: center;
        }

        /* Layer control panel */
        .layer-control {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            padding: 12px 16px;
        }
        .layer-control h4 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .layer-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 13px;
            color: #e2e8f0;
            cursor: pointer;
            user-select: none;
        }
        .layer-toggle:last-child { margin-bottom: 0; }
        .layer-toggle input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid #475569;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: all 0.15s;
        }
        .layer-toggle input[type="checkbox"]:checked {
            background: #38bdf8;
            border-color: #38bdf8;
        }
        .layer-toggle input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 3px;
            top: 0px;
            width: 5px;
            height: 9px;
            border: solid #0f172a;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Search result marker */
        .search-marker {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #38bdf8;
            border: 3px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="map-title">
        <span>UAE</span> Population Density by H3 Hexagon
    </div>

    <div class="building-search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="building-search-input" placeholder="Search building name..." autocomplete="off">
        <div id="search-results" class="search-results"></div>
    </div>

    <div class="right-panel">
        <div class="view-toggle">
            <button id="btn-flat" class="active" onclick="setView('flat')">2D Flat</button>
            <button id="btn-3d" onclick="setView('3d')">3D Extrusion</button>
        </div>

        <div class="layer-control">
            <h4>Layers</h4>
            <label class="layer-toggle">
                <input type="checkbox" id="toggle-density" checked onchange="toggleLayer('density', this.checked)">
                Density Heatmap
            </label>
            <label class="layer-toggle">
                <input type="checkbox" id="toggle-buildings" checked onchange="toggleLayer('buildings', this.checked)">
                Buildings
            </label>
            <label class="layer-toggle">
                <input type="checkbox" id="toggle-grid" checked onchange="toggleLayer('grid', this.checked)">
                Hex Grid
            </label>
        </div>

        <div class="height-control" id="height-control">
            <label>Extrusion Height</label>
            <input type="range" id="height-slider" min="0" max="20" value="8" oninput="updateHeight(this.value)">
        </div>
    </div>

    <div class="stats-panel">
        <h4>UAE Overview</h4>
        <div class="stat-row"><span class="label">Population</span><span class="value" id="stat-pop">--</span></div>
        <div class="stat-row"><span class="label">Hexagons</span><span class="value" id="stat-hex">--</span></div>
        <div class="stat-row"><span class="label">Peak Density</span><span class="value" id="stat-peak">--</span></div>
        <div class="stat-row"><span class="label">Avg Density</span><span class="value" id="stat-avg">--</span></div>
    </div>

    <div class="legend">
        <h4>People / km&sup2;</h4>
        <div class="legend-item"><div class="legend-color" style="background:#0a1128"></div>0 - 50</div>
        <div class="legend-item"><div class="legend-color" style="background:#1a3a5c"></div>50 - 200</div>
        <div class="legend-item"><div class="legend-color" style="background:#1e6091"></div>200 - 500</div>
        <div class="legend-item"><div class="legend-color" style="background:#2589bd"></div>500 - 1,000</div>
        <div class="legend-item"><div class="legend-color" style="background:#38bdf8"></div>1,000 - 2,000</div>
        <div class="legend-item"><div class="legend-color" style="background:#fbbf24"></div>2,000 - 4,000</div>
        <div class="legend-item"><div class="legend-color" style="background:#f59e0b"></div>4,000 - 7,000</div>
        <div class="legend-item"><div class="legend-color" style="background:#ef4444"></div>7,000 - 10,000</div>
        <div class="legend-item"><div class="legend-color" style="background:#dc2626"></div>10,000+</div>
    </div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoicnl1dXV1dXU4OCIsImEiOiJjbWx4ZGQ1N3MwcHU0M2ZzZzV6Z3g1c3E3In0.s557fGqZnbBmfvy7LvVJrA';

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [54.5, 24.5],
            zoom: 8,
            pitch: 0,
            bearing: 0,
            antialias: true
        });

        map.addControl(new mapboxgl.NavigationControl(), 'top-left');
        map.addControl(new mapboxgl.ScaleControl({ unit: 'metric' }), 'bottom-right');

        // Custom building search
        let buildingsDB = [];
        let searchMarker = null;
        const searchInput = document.getElementById('building-search-input');
        const searchResults = document.getElementById('search-results');

        fetch('buildings_db.json')
            .then(r => r.json())
            .then(data => { buildingsDB = data; })
            .catch(err => console.error('Failed to load buildings DB:', err));

        function fuzzyMatch(query, text) {
            const q = query.toLowerCase();
            const t = text.toLowerCase();
            if (t.includes(q)) return 2;
            const words = q.split(/\s+/);
            if (words.every(w => t.includes(w))) return 1;
            return 0;
        }

        function highlightMatch(text, query) {
            const words = query.trim().split(/\s+/).filter(w => w.length > 1);
            let result = text;
            words.forEach(w => {
                const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                result = result.replace(re, '<mark>$1</mark>');
            });
            return result;
        }

        searchInput.addEventListener('input', () => {
            const q = searchInput.value.trim();
            if (q.length < 2) { searchResults.classList.remove('visible'); return; }

            const matches = [];
            for (const item of buildingsDB) {
                const score = Math.max(fuzzyMatch(q, item.b), fuzzyMatch(q, item.b + ' ' + item.c));
                if (score > 0) matches.push({ ...item, score });
                if (matches.length >= 50) break;
            }
            matches.sort((a, b) => b.score - a.score);
            const top = matches.slice(0, 8);

            if (top.length === 0) {
                searchResults.innerHTML = '<div class="search-loading">No buildings found</div>';
            } else {
                searchResults.innerHTML = top.map((m, i) =>
                    '<div class="search-result-item" data-idx="' + i + '">' +
                    '<div class="sr-name">' + highlightMatch(m.b, q) + '</div>' +
                    '<div class="sr-community">' + m.c + '</div></div>'
                ).join('');

                searchResults.querySelectorAll('.search-result-item').forEach((el, i) => {
                    el.addEventListener('click', () => selectBuilding(top[i]));
                });
            }
            searchResults.classList.add('visible');
        });

        searchInput.addEventListener('focus', () => {
            if (searchInput.value.trim().length >= 2) searchResults.classList.add('visible');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.building-search')) searchResults.classList.remove('visible');
        });

        function selectBuilding(item) {
            searchInput.value = item.b;
            searchResults.classList.remove('visible');

            // Use pre-computed coordinates if available
            if (item.lat && item.lng) {
                // approx=true means community-level coords, zoom out a bit
                flyToBuilding([item.lng, item.lat], item.approx ? 15 : 16);
                return;
            }

            // Fallback: Mapbox Geocoding API
            const query = encodeURIComponent(item.b + ', ' + item.c + ', Dubai, UAE');
            fetch('https://api.mapbox.com/geocoding/v5/mapbox.places/' + query + '.json?access_token=' + mapboxgl.accessToken + '&bbox=54.85,24.75,55.65,25.40&limit=1&types=poi,address')
                .then(r => r.json())
                .then(data => {
                    if (data.features && data.features.length > 0) {
                        flyToBuilding(data.features[0].center);
                    } else {
                        // Last resort: community name only
                        const fallback = encodeURIComponent(item.c + ', Dubai, UAE');
                        fetch('https://api.mapbox.com/geocoding/v5/mapbox.places/' + fallback + '.json?access_token=' + mapboxgl.accessToken + '&bbox=54.85,24.75,55.65,25.40&limit=1')
                            .then(r => r.json())
                            .then(data2 => {
                                if (data2.features && data2.features.length > 0) {
                                    flyToBuilding(data2.features[0].center);
                                }
                            });
                    }
                });
        }

        function flyToBuilding(coords, zoom) {
            if (searchMarker) searchMarker.remove();
            const el = document.createElement('div');
            el.className = 'search-marker';
            searchMarker = new mapboxgl.Marker(el).setLngLat(coords).addTo(map);
            map.flyTo({ center: coords, zoom: zoom || 16, duration: 2000 });
        }

        // Color stops for density
        const densityColors = [
            [0, '#0a1128'],
            [50, '#1a3a5c'],
            [200, '#1e6091'],
            [500, '#2589bd'],
            [1000, '#38bdf8'],
            [2000, '#fbbf24'],
            [4000, '#f59e0b'],
            [7000, '#ef4444'],
            [10000, '#dc2626']
        ];

        const fillColorExpr = [
            'interpolate', ['linear'], ['get', 'density'],
            ...densityColors.flatMap(([val, color]) => [val, color])
        ];

        let currentView = 'flat';
        let heightMultiplier = 8;
        let layersReady = false;

        function initLayers() {
            if (layersReady) return;
            if (!map.isStyleLoaded()) {
                map.once('load', initLayers);
                return;
            }
            layersReady = true; // set early to prevent duplicate calls
            fetch('uae_population.geojson')
                .then(r => r.json())
                .then(data => {
                    // Compute stats
                    const features = data.features;
                    let totalPop = 0, maxDensity = 0, totalDensity = 0;
                    features.forEach(f => {
                        const p = f.properties;
                        totalPop += p.population;
                        if (p.density > maxDensity) maxDensity = p.density;
                        totalDensity += p.density;
                    });
                    document.getElementById('stat-pop').textContent = totalPop.toLocaleString();
                    document.getElementById('stat-hex').textContent = features.length.toLocaleString();
                    document.getElementById('stat-peak').textContent = Math.round(maxDensity).toLocaleString() + '/km²';
                    document.getElementById('stat-avg').textContent = Math.round(totalDensity / features.length).toLocaleString() + '/km²';

                    map.addSource('population', { type: 'geojson', data: data });

                    // Find insertion point: put hex layers below roads, buildings, and labels
                    const baseLayers = map.getStyle().layers;
                    let insertBefore;
                    for (const layer of baseLayers) {
                        if (layer.id === 'building' || layer.id.startsWith('road') || layer.id.startsWith('bridge') || layer.type === 'symbol') {
                            insertBefore = layer.id;
                            break;
                        }
                    }

                    // Flat fill layer (inserted below map roads/buildings/labels)
                    map.addLayer({
                        id: 'pop-fill',
                        type: 'fill',
                        source: 'population',
                        paint: {
                            'fill-color': fillColorExpr,
                            'fill-opacity': 0.7
                        }
                    }, insertBefore);

                    // Hexagon outline (inserted right after pop-fill, still below roads)
                    map.addLayer({
                        id: 'pop-outline',
                        type: 'line',
                        source: 'population',
                        paint: {
                            'line-color': 'rgba(255,255,255,0.35)',
                            'line-width': ['interpolate', ['linear'], ['zoom'],
                                10, 0.5,
                                14, 1.2,
                                17, 2
                            ]
                        }
                    }, insertBefore);

                    // 3D extrusion layer (hidden initially)
                    map.addLayer({
                        id: 'pop-extrusion',
                        type: 'fill-extrusion',
                        source: 'population',
                        layout: { visibility: 'none' },
                        paint: {
                            'fill-extrusion-color': fillColorExpr,
                            'fill-extrusion-height': ['*', ['get', 'density'], heightMultiplier],
                            'fill-extrusion-base': 0,
                            'fill-extrusion-opacity': 0.85
                        }
                    });

                    // Building footprints from Mapbox vector tiles (on top of everything)
                    map.addLayer({
                        id: 'buildings-fill',
                        type: 'fill',
                        source: 'composite',
                        'source-layer': 'building',
                        paint: {
                            'fill-color': '#ffffff',
                            'fill-opacity': 0.25
                        }
                    });
                    map.addLayer({
                        id: 'buildings-outline',
                        type: 'line',
                        source: 'composite',
                        'source-layer': 'building',
                        paint: {
                            'line-color': 'rgba(255,255,255,0.6)',
                            'line-width': 1
                        }
                    });

                    // 3D building extrusions (hidden initially, shown in 3D mode)
                    map.addLayer({
                        id: 'buildings-3d',
                        type: 'fill-extrusion',
                        source: 'composite',
                        'source-layer': 'building',
                        layout: { visibility: 'none' },
                        paint: {
                            'fill-extrusion-color': '#c8d6e5',
                            'fill-extrusion-height': ['get', 'height'],
                            'fill-extrusion-base': ['get', 'min_height'],
                            'fill-extrusion-opacity': 0.6
                        }
                    });

                    // Hover + click interaction
                    const popup = new mapboxgl.Popup({
                        closeButton: true,
                        closeOnClick: true,
                        maxWidth: '280px'
                    });

                    function getActiveLayer() {
                        return currentView === '3d' ? 'pop-extrusion' : 'pop-fill';
                    }

                    map.on('mousemove', 'pop-fill', (e) => {
                        if (currentView !== 'flat') return;
                        map.getCanvas().style.cursor = 'pointer';
                    });
                    map.on('mouseleave', 'pop-fill', () => {
                        map.getCanvas().style.cursor = '';
                    });
                    map.on('mousemove', 'pop-extrusion', (e) => {
                        if (currentView !== '3d') return;
                        map.getCanvas().style.cursor = 'pointer';
                    });
                    map.on('mouseleave', 'pop-extrusion', () => {
                        map.getCanvas().style.cursor = '';
                    });

                    function showPopup(e) {
                        const props = e.features[0].properties;
                        const density = props.density;
                        let tier = 'low';
                        if (density > 4000) tier = 'high';
                        else if (density > 1000) tier = 'med';

                        popup.setLngLat(e.lngLat).setHTML(`
                            <div class="popup-title">H3 Hexagon Details</div>
                            <div class="popup-stat">
                                <span class="label">Population</span>
                                <span class="value">${Number(props.population).toLocaleString()}</span>
                            </div>
                            <div class="popup-stat">
                                <span class="label">Density</span>
                                <span class="value ${tier}">${Math.round(density).toLocaleString()}/km²</span>
                            </div>
                            <div class="popup-stat">
                                <span class="label">Area</span>
                                <span class="value">${Number(props.area_km2).toFixed(2)} km²</span>
                            </div>
                        `).addTo(map);
                    }

                    map.on('click', 'pop-fill', (e) => { if (currentView === 'flat') showPopup(e); });
                    map.on('click', 'pop-extrusion', (e) => { if (currentView === '3d') showPopup(e); });
                })
                .catch(err => console.error('Data load error:', err));
        }

        // Robust init: try immediately, on load event, and as a fallback
        map.on('load', initLayers);
        initLayers();
        setTimeout(() => { if (!layersReady) initLayers(); }, 2000);

        function setView(view) {
            currentView = view;
            document.getElementById('btn-flat').classList.toggle('active', view === 'flat');
            document.getElementById('btn-3d').classList.toggle('active', view === '3d');
            document.getElementById('height-control').style.display = view === '3d' ? 'block' : 'none';

            if (!layersReady) return;

            if (view === '3d') {
                map.setLayoutProperty('pop-fill', 'visibility', 'none');
                map.setLayoutProperty('pop-outline', 'visibility', layerState.grid ? 'visible' : 'none');
                map.setLayoutProperty('pop-extrusion', 'visibility', layerState.density ? 'visible' : 'none');
                map.setLayoutProperty('buildings-fill', 'visibility', 'none');
                map.setLayoutProperty('buildings-outline', 'visibility', 'none');
                map.setLayoutProperty('buildings-3d', 'visibility', layerState.buildings ? 'visible' : 'none');
                map.easeTo({ pitch: 55, bearing: -20, duration: 1000 });
            } else {
                map.setLayoutProperty('pop-fill', 'visibility', layerState.density ? 'visible' : 'none');
                map.setLayoutProperty('pop-outline', 'visibility', layerState.grid ? 'visible' : 'none');
                map.setLayoutProperty('pop-extrusion', 'visibility', 'none');
                map.setLayoutProperty('buildings-fill', 'visibility', layerState.buildings ? 'visible' : 'none');
                map.setLayoutProperty('buildings-outline', 'visibility', layerState.buildings ? 'visible' : 'none');
                map.setLayoutProperty('buildings-3d', 'visibility', 'none');
                map.easeTo({ pitch: 0, bearing: 0, duration: 1000 });
            }
        }

        function updateHeight(val) {
            if (!layersReady) return;
            heightMultiplier = Number(val);
            if (heightMultiplier === 0) {
                map.setLayoutProperty('pop-extrusion', 'visibility', 'none');
            } else {
                map.setLayoutProperty('pop-extrusion', 'visibility', layerState.density ? 'visible' : 'none');
                map.setPaintProperty('pop-extrusion', 'fill-extrusion-height', ['*', ['get', 'density'], heightMultiplier]);
            }
        }

        // Layer toggle state
        const layerState = { density: true, buildings: true, grid: true };

        function toggleLayer(layer, visible) {
            if (!layersReady) return;
            layerState[layer] = visible;
            const vis = visible ? 'visible' : 'none';

            if (layer === 'density') {
                map.setLayoutProperty('pop-fill', 'visibility', vis);
            } else if (layer === 'buildings') {
                if (currentView === '3d') {
                    map.setLayoutProperty('buildings-3d', 'visibility', vis);
                } else {
                    map.setLayoutProperty('buildings-fill', 'visibility', vis);
                    map.setLayoutProperty('buildings-outline', 'visibility', vis);
                }
            } else if (layer === 'grid') {
                map.setLayoutProperty('pop-outline', 'visibility', vis);
            }
        }
    </script>
</body>
</html>
